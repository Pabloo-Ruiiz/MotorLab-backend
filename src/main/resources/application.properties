spring.application.name=motorlab-backend
logging.level.org.springframework.web=DEBUG
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.datasource.url=jdbc:postgresql://localhost:5432/motorlabdb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-horas=8
app.stock-bajo-umbral=2

# Sin MAIL_HOST no se envía nada: el enlace de verificación se escribe en el log
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.correo.remitente=${MAIL_FROM:${MAIL_USER:no-reply@motorlab.local}}
# Con estas tres variables el correo sale por la API HTTPS de Gmail, con prioridad sobre SMTP
app.correo.gmail.client-id=${GMAIL_CLIENT_ID:}
app.correo.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
app.correo.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
# Solo desarrollo: si falla el envío, escribe el enlace de verificación en el log
app.correo.enlace-en-log=${MAIL_ENLACE_EN_LOG:false}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html